{% extends 'base.html' %}

{% block title %}Delete program{% endblock %}
{% block page_title %}Delete program{% endblock %}

{% block content %}
<div class="card card-danger">
  <div class="card-body">
    <p>Are you sure you want to delete the program <strong>{{ object.name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Confirm delete</button>
      <a href="{% url 'nutrition:program_list' %}" class="btn btn-default">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

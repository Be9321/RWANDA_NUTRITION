<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <defs>
    <style>
      .title { font: bold 26px Arial; fill: #1f2937; }
      .box { fill: #f8fafc; stroke: #374151; stroke-width: 2; rx: 12; }
      .entity { font: bold 18px Arial; fill: #111827; }
      .attr { font: 14px Arial; fill: #374151; }
      .line { stroke: #1f2937; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .label { font: 13px Arial; fill: #1f2937; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2937" />
    </marker>
  </defs>

  <text x="420" y="40" class="title">Rwanda Nutrition ER Diagram</text>

  <rect x="70" y="110" width="220" height="140" class="box"/>
  <text x="110" y="145" class="entity">Province</text>
  <text x="90" y="175" class="attr">• id</text>
  <text x="90" y="200" class="attr">• name</text>

  <rect x="360" y="110" width="220" height="140" class="box"/>
  <text x="405" y="145" class="entity">District</text>
  <text x="380" y="175" class="attr">• id</text>
  <text x="380" y="200" class="attr">• name</text>
  <text x="380" y="225" class="attr">• province_id</text>

  <rect x="650" y="110" width="220" height="140" class="box"/>
  <text x="705" y="145" class="entity">Sector</text>
  <text x="670" y="175" class="attr">• id</text>
  <text x="670" y="200" class="attr">• name</text>
  <text x="670" y="225" class="attr">• district_id</text>

  <rect x="850" y="300" width="220" height="170" class="box"/>
  <text x="885" y="335" class="entity">HealthFacility</text>
  <text x="870" y="365" class="attr">• id</text>
  <text x="870" y="390" class="attr">• name</text>
  <text x="870" y="415" class="attr">• facility_type</text>
  <text x="870" y="440" class="attr">• sector_id</text>

  <rect x="65" y="375" width="240" height="170" class="box"/>
  <text x="128" y="410" class="entity">Household</text>
  <text x="85" y="440" class="attr">• id</text>
  <text x="85" y="465" class="attr">• household_code</text>
  <text x="85" y="490" class="attr">• head_name</text>
  <text x="85" y="515" class="attr">• sector_id</text>

  <rect x="360" y="375" width="260" height="180" class="box"/>
  <text x="455" y="410" class="entity">Child</text>
  <text x="380" y="440" class="attr">• id</text>
  <text x="380" y="465" class="attr">• full_name</text>
  <text x="380" y="490" class="attr">• sex</text>
  <text x="380" y="515" class="attr">• date_of_birth</text>
  <text x="380" y="540" class="attr">• household_id</text>

  <rect x="710" y="375" width="260" height="180" class="box"/>
  <text x="805" y="410" class="entity">GrowthMeasurement</text>
  <text x="730" y="440" class="attr">• id</text>
  <text x="730" y="465" class="attr">• measurement_date</text>
  <text x="730" y="490" class="attr">• weight_kg</text>
  <text x="730" y="515" class="attr">• height_cm</text>
  <text x="730" y="540" class="attr">• child_id</text>

  <rect x="400" y="610" width="220" height="150" class="box"/>
  <text x="470" y="645" class="entity">Program</text>
  <text x="420" y="675" class="attr">• id</text>
  <text x="420" y="700" class="attr">• name</text>

  <rect x="680" y="610" width="240" height="150" class="box"/>
  <text x="762" y="645" class="entity">Referral</text>
  <text x="700" y="675" class="attr">• id</text>
  <text x="700" y="700" class="attr">• reason</text>
  <text x="700" y="725" class="attr">• child_id</text>

  <path d="M290 180 L360 180" class="line"/>
  <text x="305" y="165" class="label">1</text>
  <text x="325" y="165" class="label">many</text>

  <path d="M580 180 L650 180" class="line"/>
  <text x="595" y="165" class="label">1</text>
  <text x="615" y="165" class="label">many</text>

  <path d="M760 250 L930 300" class="line"/>
  <text x="810" y="290" class="label">1</text>
  <text x="840" y="290" class="label">many</text>

  <path d="M305 440 L360 440" class="line"/>
  <text x="325" y="425" class="label">1</text>
  <text x="345" y="425" class="label">many</text>

  <path d="M620 440 L710 440" class="line"/>
  <text x="650" y="425" class="label">1</text>
  <text x="670" y="425" class="label">many</text>

  <path d="M510 555 L510 610" class="line"/>
  <text x="490" y="580" class="label">many</text>
  <text x="535" y="580" class="label">many</text>

  <path d="M780 555 L780 610" class="line"/>
  <text x="760" y="580" class="label">many</text>
  <text x="805" y="580" class="label">many</text>

  <path d="M620 685 L680 685" class="line"/>
  <text x="640" y="670" class="label">1</text>
  <text x="660" y="670" class="label">many</text>

  <text x="305" y="110" class="label">belongs to</text>
  <text x="610" y="110" class="label">contains</text>
  <text x="830" y="280" class="label">serves</text>
  <text x="315" y="360" class="label">located in</text>
  <text x="640" y="360" class="label">has many</text>
  <text x="515" y="590" class="label">enrolled in</text>
  <text x="700" y="590" class="label">referred to</text>
</svg>
